<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes · Calzado</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:#faf9f8;color:#1c1b19;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid rgba(0,0,0,.07);background:#fff}
  h1{font-size:15px;font-weight:600;margin:0}
  .badge{font-size:11px;color:#6b6864;background:rgba(0,0,0,.045);border-radius:6px;padding:3px 7px}
  .grow{flex:1}
  header a{font-size:12.5px;color:#3a53c9;text-decoration:none}
  .filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px 22px;background:#fff;border-bottom:1px solid rgba(0,0,0,.06)}
  .filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#7b776f}
  select,input{font-family:inherit;font-size:12.5px;padding:5px 7px;border:1px solid rgba(0,0,0,.14);border-radius:7px;background:#fff;color:#1c1b19;outline:none}
  main{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:20px 22px;max-width:1100px;margin:0 auto}
  .card{grid-column:span 2;border:1px solid rgba(0,0,0,.09);border-radius:12px;background:#fff;overflow:hidden}
  @media(min-width:900px){.card.half{grid-column:span 1}}
  .card-head{padding:12px 14px;border-bottom:1px solid rgba(0,0,0,.06)}
  .card-title{font-size:13px;font-weight:600}
  .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .kpi{font-size:11.5px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.05);color:#4a4740}
  .kpi.positive{background:rgba(47,143,122,.14);color:#1f6b5a}
  .kpi.negative{background:rgba(201,79,109,.14);color:#a13350}
  .chart{width:100%;height:300px}
  .meta{padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#a09b93}
  .err{padding:16px;color:#8f2018;font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>Reportes · Calzado</h1>
  <span class="badge">DataComex · TARIC 64 · datos sintéticos</span>
  <span class="grow"></span>
  <a href="/">← Chat</a>
</header>

<div class="filters">
  <label>Flujo
    <select id="flow">
      <option value="IMPORT">Importaciones</option>
      <option value="EXPORT">Exportaciones</option>
    </select>
  </label>
  <label>Partida
    <select id="taric"><option value="64">Todo el calzado (cap. 64)</option></select>
  </label>
  <label>Meses
    <input id="months" type="number" min="6" max="36" value="24" style="width:70px">
  </label>
</div>

<main id="grid"></main>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };

const WIDGETS = [
  { key: "evolution", title: "Evolución mensual (M€)", half: false,
    url: f => `/api/v1/reports/footwear/evolution?flow=${f.flow}&taric=${f.taric}&months=${f.months}` },
  { key: "countries", title: "Principales socios (M€)", half: false,
    url: f => `/api/v1/reports/footwear/countries?flow=${f.flow}&taric=${f.taric}&top_n=10` },
  { key: "mix", title: "Mix de producto", half: true,
    url: f => `/api/v1/reports/footwear/product-mix?flow=${f.flow}` },
  { key: "price", title: "Precio medio (€/kg)", half: true,
    url: f => `/api/v1/reports/footwear/avg-price?flow=${f.flow}&taric=${f.taric}&months=${f.months}` },
  { key: "balance", title: "Saldo comercial (M€)", half: false,
    url: f => `/api/v1/reports/footwear/balance?taric=${f.taric}&months=${f.months}` },
];

const charts = {};

function filters() {
  return { flow: $("#flow").value, taric: $("#taric").value, months: $("#months").value };
}

function renderCard(w, spec) {
  const card = el("div", "card" + (w.half ? " half" : ""));
  const head = el("div", "card-head");
  head.appendChild(el("div", "card-title", spec.title || w.title));
  const kpis = el("div", "kpis");
  (spec.kpis || []).forEach(k => kpis.appendChild(el("span", "kpi " + (k.tone || ""), `${k.label}: ${k.value}`)));
  if (kpis.children.length) head.appendChild(kpis);
  card.appendChild(head);

  const host = el("div", "chart");
  card.appendChild(host);

  const m = spec.meta || {};
  card.appendChild(el("div", "meta",
    [m.unit && "unidad " + m.unit, m.granularity, m.is_provisional && "· incluye datos provisionales"]
      .filter(Boolean).join(" ")));

  return { card, host, spec };
}

async function load() {
  const grid = $("#grid");
  grid.innerHTML = "";
  Object.values(charts).forEach(c => c.dispose());
  const f = filters();

  for (const w of WIDGETS) {
    try {
      const spec = await fetch(w.url(f)).then(r => r.json());
      const { card, host } = renderCard(w, spec);
      grid.appendChild(card);
      const inst = echarts.init(host, null, { renderer: "svg" });
      inst.setOption(spec.echarts);
      new ResizeObserver(() => inst.resize()).observe(host);
      charts[w.key] = inst;
    } catch (e) {
      const card = el("div", "card");
      card.appendChild(el("div", "err", `No se pudo cargar «${w.title}»: ${e}`));
      grid.appendChild(card);
    }
  }
}

async function init() {
  try {
    const opts = await fetch("/api/v1/reports/footwear/filters/options").then(r => r.json());
    const sel = $("#taric");
    (opts.headings || []).forEach(h => {
      const o = el("option", null, `${h.code} — ${h.description}`);
      o.value = h.code;
      sel.appendChild(o);
    });
  } catch (e) { /* selectores mínimos si falla */ }

  ["#flow", "#taric", "#months"].forEach(s => $(s).addEventListener("change", load));
  load();
}

init();
</script>
</body>
</html>
