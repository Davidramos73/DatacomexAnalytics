<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceder · Analista de Calzado</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#faf9f8;color:#1c1b19;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:360px;padding:32px 28px;background:#fff;border:1px solid rgba(0,0,0,.09);
        border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.05);text-align:center}
  .logo{width:34px;height:34px;border-radius:9px;background:#3a53c9;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
  .logo i{width:13px;height:13px;border-radius:3px;background:#fff;display:block}
  h1{font-size:17px;font-weight:600;margin:0 0 4px}
  p{font-size:13px;color:#6b6864;line-height:1.5;margin:0 0 22px}
  #gbtn{display:flex;justify-content:center;min-height:44px}
  .err{margin-top:16px;font-size:12.5px;color:#8f2018;line-height:1.5}
  .foot{margin-top:22px;font-size:11px;color:#a09b93}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><i></i></div>
  <h1>Analista de Calzado</h1>
  <p>Comercio exterior de calzado · DataComex. Acceso restringido.</p>
  <div id="gbtn"></div>
  <div class="err" id="err" hidden></div>
  <div class="foot">Inicia sesión con tu cuenta de Google autorizada.</div>
</div>

<script>
const err = document.getElementById("err");
function showErr(msg) { err.textContent = msg; err.hidden = false; }

async function onCredential(resp) {
  err.hidden = true;
  try {
    const r = await fetch("/auth/google", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ credential: resp.credential }),
    });
    if (r.ok) { location.href = "/"; return; }
    if (r.status === 403) showErr("Tu cuenta no está autorizada. Contacta al administrador.");
    else showErr("No se pudo iniciar sesión (" + r.status + ").");
  } catch (e) {
    showErr("Error de red: " + e);
  }
}

async function init() {
  let cfg;
  try { cfg = await fetch("/auth/config").then(r => r.json()); }
  catch (e) { showErr("No se pudo cargar la configuración."); return; }

  if (!cfg.auth_enabled) { location.href = "/"; return; }
  if (!cfg.client_id) { showErr("Login no configurado (falta GOOGLE_CLIENT_ID)."); return; }

  const start = () => {
    if (!window.google?.accounts?.id) return setTimeout(start, 100);
    google.accounts.id.initialize({ client_id: cfg.client_id, callback: onCredential });
    google.accounts.id.renderButton(document.getElementById("gbtn"), {
      theme: "outline", size: "large", text: "signin_with", locale: "es",
    });
  };
  start();
}

init();
</script>
</body>
</html>
