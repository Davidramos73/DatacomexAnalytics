<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceder · Analista de Calzado</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="/chatkit.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="login">
<div class="card">
  <div class="logo"><i></i></div>
  <h1>Analista de Calzado</h1>
  <p>Comercio exterior de calzado · DataComex. Acceso restringido.</p>
  <div id="gbtn"></div>
  <div class="err" id="err" hidden></div>
  <div class="foot">Inicia sesión con tu cuenta de Google autorizada. Al acceder
    registramos tu email y la fecha de acceso, solo para control de uso.</div>
</div>

<script>
const err = document.getElementById("err");
function showErr(msg) { err.textContent = msg; err.hidden = false; }

async function onCredential(resp) {
  err.hidden = true;
  try {
    const r = await fetch("/auth/google", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ credential: resp.credential }),
    });
    if (r.ok) { location.href = "/"; return; }
    if (r.status === 403) showErr("Tu cuenta no está autorizada. Contacta al administrador.");
    else showErr("No se pudo iniciar sesión (" + r.status + ").");
  } catch (e) {
    showErr("Error de red: " + e);
  }
}

async function init() {
  let cfg;
  try { cfg = await fetch("/auth/config").then(r => r.json()); }
  catch (e) { showErr("No se pudo cargar la configuración."); return; }

  if (!cfg.auth_enabled) { location.href = "/"; return; }
  if (!cfg.client_id) { showErr("Login no configurado (falta GOOGLE_CLIENT_ID)."); return; }

  const start = () => {
    if (!window.google?.accounts?.id) return setTimeout(start, 100);
    google.accounts.id.initialize({ client_id: cfg.client_id, callback: onCredential });
    google.accounts.id.renderButton(document.getElementById("gbtn"), {
      theme: "outline", size: "large", text: "signin_with", locale: "es",
    });
  };
  start();
}

init();
</script>
</body>
</html>
