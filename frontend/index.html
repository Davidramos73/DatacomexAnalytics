<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analista de Calzado · DataComex</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/theme/macarons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/theme/vintage.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/theme/westeros.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/theme/roma.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/theme/shine.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/theme/walden.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/theme/chalk.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%}
  body{background:#faf9f8;color:#1c1b19;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  @keyframes dotpulse{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .app{display:flex;height:100vh;overflow:hidden}

  /* sidebar */
  .sidebar{flex:none;width:266px;display:flex;flex-direction:column;background:#f2f0ec;border-right:1px solid rgba(0,0,0,.07);overflow:hidden;transition:width .16s ease}
  .sidebar.collapsed{width:56px}
  .sidebar.collapsed .sb-hideable,
  .sidebar.collapsed .sb-name,
  .sidebar.collapsed .nc-label{display:none}
  .sidebar.collapsed .sb-top,
  .sidebar.collapsed .sb-actions{padding-left:8px;padding-right:8px}
  .sb-top{display:flex;align-items:center;gap:9px;padding:14px 12px 10px}
  .sb-logo{flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#3a53c9}
  .sb-logo i{width:8px;height:8px;border-radius:2px;background:#fff}
  .sb-name{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
  .icon-btn{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:6px;cursor:pointer;color:#6b6864}
  .icon-btn:hover{background:rgba(0,0,0,.06)}
  .sb-actions{padding:2px 10px 8px;display:flex;flex-direction:column;gap:8px}
  .new-chat,.sb-nav{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;text-align:left;cursor:pointer;text-decoration:none}
  .new-chat{background:#fff;border:1px solid rgba(0,0,0,.1);color:#1c1b19;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .new-chat:hover{background:#fffdfa;border-color:rgba(0,0,0,.2)}
  .sb-nav{background:#3a53c9;border:1px solid #3a53c9;color:#fff}
  .sb-nav:hover{background:#2f45ad}
  .sidebar.collapsed .new-chat,.sidebar.collapsed .sb-nav{justify-content:center;padding:8px 0}
  .search{display:flex;align-items:center;gap:7px;padding:7px 9px;background:rgba(0,0,0,.045);border-radius:8px}
  .search input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:12.5px;color:#1c1b19;font-family:inherit}
  .sb-list{flex:1;overflow-y:auto;padding:6px 8px 8px}
  .sb-section{padding:6px 8px 4px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#9a968f}
  .chat-row{display:flex;align-items:center;border-radius:8px;position:relative;margin-bottom:1px}
  .chat-row:hover{background:rgba(0,0,0,.05)}
  .chat-row.active{background:rgba(0,0,0,.065)}
  .chat-row .sel{flex:1;min-width:0;text-align:left;padding:7px 9px;border:none;background:transparent;cursor:pointer;font-size:13px;color:#2c2a27;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-row.active .sel{font-weight:600}
  .chat-row .menu-btn{opacity:0;flex:none;width:24px;height:24px;margin-right:4px;border:none;background:transparent;border-radius:6px;cursor:pointer;color:#6b6864}
  .chat-row:hover .menu-btn,.chat-row .menu-btn.open{opacity:1}
  .chat-row .menu-btn:hover{background:rgba(0,0,0,.08)}
  .chat-row .rename{flex:1;min-width:0;margin:3px 6px;padding:5px 7px;border:1px solid rgba(0,0,0,.2);border-radius:6px;font-size:13px;font-family:inherit;outline:none}
  .menu-pop{position:absolute;right:6px;top:32px;z-index:40;width:154px;padding:5px;background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:9px;box-shadow:0 8px 26px rgba(0,0,0,.14)}
  .menu-pop button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:none;background:transparent;border-radius:6px;font-size:12.5px;color:#2c2a27;cursor:pointer;text-align:left}
  .menu-pop button:hover{background:rgba(0,0,0,.05)}
  .menu-pop button.danger{color:#b3261e}
  .menu-pop button.danger:hover{background:rgba(179,38,30,.08)}
  .sb-foot{flex:none;padding:9px 12px;border-top:1px solid rgba(0,0,0,.07);font-size:11px;color:#9a968f;white-space:nowrap;overflow:hidden}

  /* main */
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:0 18px;height:52px;border-bottom:1px solid rgba(0,0,0,.06)}
  .title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{flex:none;display:flex;align-items:center;gap:5px;padding:3px 7px;background:rgba(0,0,0,.045);border-radius:6px;font-size:11px;color:#6b6864}
  .badge span{width:5px;height:5px;border-radius:50%;background:#2f8f7a}
  .grow{flex:1}
  .engine{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8b8781}
  .theme-sel{font-family:inherit;font-size:11.5px;color:#4a4740;background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:7px;padding:4px 6px;cursor:pointer;outline:none}
  .thread{flex:1;overflow-y:auto;overflow-x:hidden}
  .thread-inner{max-width:760px;margin:0 auto;padding:26px 24px 40px;display:flex;flex-direction:column;gap:26px}
  .user{align-self:flex-end;max-width:78%;padding:10px 14px;background:#ebe8e3;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.55}
  .agent{display:flex;gap:12px}
  .avatar{flex:none;width:24px;height:24px;border-radius:7px;margin-top:2px;background:#3a53c9}
  .agent-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .trace{border:1px solid rgba(0,0,0,.08);border-radius:9px;background:#fff;overflow:hidden}
  .trace summary{padding:8px 10px;font-size:12px;color:#6b6864;cursor:pointer}
  .trace .steps{border-top:1px solid rgba(0,0,0,.06);padding:9px 12px;display:flex;flex-direction:column;gap:8px;background:#fcfbf9}
  .step-label{font-size:12px;font-weight:500;color:#3a3835}
  .step-detail{margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.5;color:#7b776f;white-space:pre-wrap;word-break:break-word}
  .para{font-size:14.5px;line-height:1.65;color:#26241f}
  .thinking{display:flex;align-items:center;gap:8px;font-size:13px;color:#8b8781}
  .thinking i{width:5px;height:5px;border-radius:50%;background:#a09b93;animation:dotpulse 1.2s infinite}
  .thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
  .card{border:1px solid rgba(0,0,0,.09);border-radius:11px;background:#fff;overflow:hidden}
  .card-head{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid rgba(0,0,0,.06)}
  .card-title{flex:1;font-size:12.5px;font-weight:600}
  .card-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#a09b93}
  .tabs{display:flex;gap:2px;padding:2px;background:rgba(0,0,0,.045);border-radius:7px}
  .tabs button{padding:4px 9px;border:none;border-radius:5px;font-size:11.5px;cursor:pointer;background:transparent;color:#7b776f}
  .tabs button.on{background:#fff;color:#1c1b19;font-weight:600}
  .card-body{padding:14px 12px}
  .spec-view{max-height:320px;overflow:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;white-space:pre;background:#fbfaf8;padding:12px}
  .err{padding:16px 14px;background:#fdf8f6}
  .err-title{font-size:13px;font-weight:600;color:#8f2018}
  .err-text{margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8a6560;white-space:pre-wrap}
  table{border-collapse:collapse;font-size:11.5px;font-family:'IBM Plex Mono',monospace}
  th,td{padding:6px 10px;border-bottom:1px solid rgba(0,0,0,.05);text-align:left}
  th{background:#f6f4f1;color:#7b776f;text-transform:uppercase;letter-spacing:.05em}
  .composer{flex:none;padding:0 24px 20px}
  .composer-inner{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:9px 9px 9px 14px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:14px}
  textarea{flex:1;border:none;outline:none;resize:none;font-size:14px;line-height:1.5;font-family:inherit;background:transparent;max-height:140px;padding:5px 0}
  .send{flex:none;width:32px;height:32px;border:none;border-radius:9px;cursor:pointer;color:#fff;background:#3a53c9;font-size:15px}
  .send:disabled{background:#c9c4bb}
  .hint{max-width:760px;margin:7px auto 0;text-align:center;font-size:11px;color:#a09b93}
  .empty{margin:14vh auto 0;text-align:center;color:#6b6864;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .empty h1{font-size:24px;color:#1c1b19;margin:0}
  .empty p{margin:0;line-height:1.55}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chips button{padding:8px 12px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:999px;font-size:12.5px;color:#2c2a27;cursor:pointer}
  .chips button:hover{border-color:rgba(0,0,0,.28);background:#fffdfa}

  /* views */
  #chatView,#reportsView{flex:1;min-height:0;display:flex;flex-direction:column}
  #chatView[hidden],#reportsView[hidden]{display:none}
  .sb-nav.active{background:#2f45ad;border-color:#2f45ad}

  /* reports view */
  .rp-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 22px;border-bottom:1px solid rgba(0,0,0,.06);background:#fff}
  .rp-filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#7b776f}
  .rp-filters select,.rp-filters input{font-family:inherit;font-size:12.5px;padding:5px 7px;border:1px solid rgba(0,0,0,.14);border-radius:7px;background:#fff;color:#1c1b19;outline:none}
  .rp-back{font-family:inherit;font-size:12px;color:#3a53c9;background:transparent;border:none;cursor:pointer;padding:6px 4px;margin-right:6px}
  .rp-back:hover{text-decoration:underline}
  .rp-scroll{flex:1;overflow-y:auto;padding:20px 22px}
  .rp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:1100px;margin:0 auto}
  .rp-card{grid-column:span 2;border:1px solid rgba(0,0,0,.09);border-radius:12px;background:#fff;overflow:hidden}
  @media(min-width:900px){.rp-card.half{grid-column:span 1}}
  .rp-card-head{padding:12px 14px;border-bottom:1px solid rgba(0,0,0,.06)}
  .rp-card-title{font-size:13px;font-weight:600}
  .rp-kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .rp-kpi{font-size:11.5px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.05);color:#4a4740}
  .rp-kpi.positive{background:rgba(47,143,122,.14);color:#1f6b5a}
  .rp-kpi.negative{background:rgba(201,79,109,.14);color:#a13350}
  .rp-chart{width:100%;height:300px}
  .rp-meta{padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#a09b93}
  .rp-err{padding:16px;color:#8f2018;font-size:12.5px}

  .overlay{position:fixed;inset:0;z-index:60;background:rgba(28,27,25,.32);display:flex;align-items:center;justify-content:center;padding:24px}
  .dialog{width:100%;max-width:360px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.24);padding:20px}
  .dialog h3{margin:0;font-size:15px;font-weight:600}
  .dialog p{margin:8px 0 0;font-size:13px;line-height:1.55;color:#6b6864}
  .dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .dialog button{padding:8px 13px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
  .dialog .cancel{border:1px solid rgba(0,0,0,.12);background:#fff;color:#1c1b19}
  .dialog .confirm{border:none;background:#b3261e;color:#fff}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:70;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 14px;background:#1c1b19;color:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);font-size:12.5px}
  .toast button{border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:500;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-logo"><i></i></div>
      <div class="sb-name">Calzado · DataComex</div>
      <button class="icon-btn" id="collapseBtn" title="Toggle sidebar">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="2"></rect><line x1="6.5" y1="3" x2="6.5" y2="13"></line></svg>
      </button>
    </div>
    <div class="sb-actions">
      <button class="sb-nav" id="navReports" title="Panel de reportes">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="13" x2="13" y2="13"></line><rect x="3.5" y="7" width="2.6" height="4"></rect><rect x="9.4" y="4" width="2.6" height="7"></rect></svg>
        <span class="nc-label">Panel de reportes</span>
      </button>
      <button class="new-chat" id="newChatBtn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="8" y1="3" x2="8" y2="13"></line><line x1="3" y1="8" x2="13" y2="8"></line></svg>
        <span class="nc-label">Nuevo chat</span>
      </button>
      <div class="search sb-hideable">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#8b8781" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.2"></circle><line x1="10.2" y1="10.2" x2="13.5" y2="13.5"></line></svg>
        <input id="searchInput" placeholder="Buscar chats" autocomplete="off">
      </div>
    </div>
    <div class="sb-list sb-hideable" id="chatList"></div>
    <div class="sb-foot sb-hideable">Guardado en este navegador</div>
  </aside>

  <main>
    <header>
      <div class="title" id="headerTitle">Nuevo chat</div>
      <div class="badge"><span></span>DataComex · TARIC 64</div>
      <div class="grow"></div>
      <select class="theme-sel" id="themeSel" title="Tema del gráfico"></select>
      <div class="engine">echarts v5</div>
    </header>

    <div id="chatView">
      <div class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="draft" rows="1" placeholder="Pregunta sobre el calzado…"></textarea>
          <button class="send" id="send">↑</button>
        </div>
        <div class="hint">Comercio exterior de calzado (cap. 64). Datos sintéticos ·
          <a href="#" id="hintReports">ver panel de reportes</a></div>
      </div>
    </div>

    <div id="reportsView" hidden>
      <div class="rp-filters">
        <button class="rp-back" id="rpBack" type="button">← Volver al chat</button>
        <label>Flujo
          <select id="rpFlow">
            <option value="IMPORT">Importaciones</option>
            <option value="EXPORT">Exportaciones</option>
          </select>
        </label>
        <label>Partida
          <select id="rpTaric"><option value="64">Todo el calzado (cap. 64)</option></select>
        </label>
        <label>Meses
          <input id="rpMonths" type="number" min="6" max="36" value="24" style="width:70px">
        </label>
      </div>
      <div class="rp-scroll"><div class="rp-grid" id="rpGrid"></div></div>
    </div>
  </main>
</div>

<script>
/* "lumen" — a custom theme tuned to this app's paper / indigo palette. */
echarts.registerTheme("lumen", {
  color: ["#3a53c9", "#2f8f7a", "#c9772f", "#8a5cd0", "#c94f6d", "#3f8fc9"],
  backgroundColor: "transparent",
  textStyle: { fontFamily: "'IBM Plex Sans', system-ui, sans-serif", color: "#1c1b19" },
  title: { textStyle: { color: "#1c1b19", fontWeight: 600, fontSize: 13 } },
  grid: { left: 8, right: 22, top: 34, bottom: 8, containLabel: true },
  categoryAxis: {
    axisLine: { lineStyle: { color: "#d9d4cc" } },
    axisTick: { show: false },
    axisLabel: { color: "#7b776f" },
    splitLine: { show: false },
  },
  valueAxis: {
    axisLine: { show: false },
    axisTick: { show: false },
    axisLabel: { color: "#7b776f" },
    nameTextStyle: { color: "#a09b93", align: "left", padding: [0, 0, 4, 0] },
    splitLine: { lineStyle: { color: "rgba(0,0,0,.06)" } },
  },
  line: { smooth: true, symbolSize: 7, lineStyle: { width: 2 } },
  bar: { itemStyle: { borderRadius: [4, 4, 0, 0] } },
  tooltip: {
    backgroundColor: "#fff",
    borderColor: "rgba(0,0,0,.1)",
    borderWidth: 1,
    padding: [7, 10],
    textStyle: { color: "#1c1b19", fontSize: 12 },
  },
  legend: { textStyle: { color: "#7b776f" }, icon: "roundRect", itemWidth: 10, itemHeight: 10 },
});

// [value, label]; "default" -> ECharts built-in light (no registered theme).
const THEMES = [
  ["lumen", "Lumen"], ["default", "ECharts light"], ["macarons", "Macarons"],
  ["vintage", "Vintage"], ["westeros", "Westeros"], ["roma", "Roma"],
  ["shine", "Shine"], ["walden", "Walden"], ["chalk", "Chalk (dark)"], ["dark", "Dark"],
];
const DEFAULT_THEME = "lumen";
let chartTheme = DEFAULT_THEME;

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = s => String(s).replace(/</g, "&lt;");
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const thread = $("#thread"), threadInner = $("#threadInner");
const draft = $("#draft"), sendBtn = $("#send"), sidebar = $("#sidebar");
const chatList = $("#chatList"), headerTitle = $("#headerTitle"), searchInput = $("#searchInput");

/* ---------- store (localStorage) ---------- */
const STORAGE_KEY = "lumen.v1";
const PROMPTS = ["Importaciones por país", "Evolución del calzado deportivo", "Precio medio €/kg"];
const MAX_CHATS = 40;          // keep the newest N chats
const MAX_HISTORY_TURNS = 6;   // prior user/assistant turns sent for context

const store = {
  chats: [],
  activeId: null,
  collapsed: false,
  theme: DEFAULT_THEME,
  load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      this.chats = Array.isArray(raw.chats) ? raw.chats : [];
      this.activeId = raw.activeId || null;
      this.collapsed = !!raw.collapsed;
      if (THEMES.some(t => t[0] === raw.theme)) this.theme = raw.theme;
    } catch (e) { this.chats = []; this.activeId = null; }
    if (!this.chats.length) this.newChat(false);
    if (!this.chats.find(c => c.id === this.activeId)) this.activeId = this.chats[0].id;
  },
  save() {
    if (this.chats.length > MAX_CHATS) this.chats = this.chats.slice(0, MAX_CHATS);
    const persist = () => localStorage.setItem(STORAGE_KEY, JSON.stringify({
      chats: this.chats, activeId: this.activeId, collapsed: this.collapsed, theme: this.theme,
    }));
    for (let i = 0; i < MAX_CHATS; i++) {
      try { persist(); return; }
      catch (e) {
        // Quota exceeded (or private mode). Drop the oldest chat and retry.
        if (this.chats.length <= 1) return;
        const dropped = this.chats.pop();
        if (this.activeId === dropped.id) this.activeId = this.chats[0].id;
        this.evicted = (this.evicted || 0) + 1;
      }
    }
  },
  active() { return this.chats.find(c => c.id === this.activeId); },
  newChat(save = true) {
    const c = { id: uid("c"), title: "Nuevo chat", createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
    this.chats.unshift(c);
    this.activeId = c.id;
    if (save) this.save();
    return c;
  },
  remove(id) {
    const idx = this.chats.findIndex(c => c.id === id);
    if (idx < 0) return null;
    const [gone] = this.chats.splice(idx, 1);
    if (!this.chats.length) this.newChat(false);
    if (this.activeId === id) this.activeId = this.chats[Math.min(idx, this.chats.length - 1)].id;
    this.save();
    return { chat: gone, idx };
  },
};

/* ---------- chart card ---------- */
function disposeThreadCharts() {
  threadInner.querySelectorAll(".card-body > div").forEach(d => {
    const inst = echarts.getInstanceByDom(d);
    if (inst) inst.dispose();
  });
}

function buildChartCard({ title, meta, spec }) {
  const card = el("div", "card");
  const head = el("div", "card-head");
  const titleEl = el("div", "card-title"); titleEl.textContent = title; head.appendChild(titleEl);
  const metaEl = el("div", "card-meta"); metaEl.textContent = meta; head.appendChild(metaEl);
  const tabs = el("div", "tabs");
  ["Chart", "Spec", "Data"].forEach((name, i) => {
    const b = el("button", i === 0 ? "on" : null, name);
    b.onclick = () => {
      tabs.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      show(name);
    };
    tabs.appendChild(b);
  });
  head.appendChild(tabs);
  card.appendChild(head);

  const bodyEl = el("div", "card-body");
  card.appendChild(bodyEl);

  function show(name) {
    if (bodyEl._ro) { bodyEl._ro.disconnect(); bodyEl._ro = null; }
    if (bodyEl._chart) { bodyEl._chart.dispose(); bodyEl._chart = null; }
    bodyEl.innerHTML = "";
    if (name === "Chart") {
      const host = el("div");
      host.style.width = "100%";
      host.style.height = "320px";
      bodyEl.appendChild(host);
      requestAnimationFrame(() => {
        try {
          const inst = echarts.init(host, chartTheme === "default" ? null : chartTheme, { renderer: "svg" });
          // Every theme sits on the white card — ignore a theme's own page colour.
          inst.setOption(Object.assign({ backgroundColor: "transparent" }, spec));
          const ro = new ResizeObserver(() => inst.resize());
          ro.observe(host);
          bodyEl._chart = inst;
          bodyEl._ro = ro;
        } catch (err) {
          bodyEl.innerHTML =
            '<div class="err"><div class="err-title">Render error</div><div class="err-text">'
            + esc(err) + "</div></div>";
        }
      });
    } else if (name === "Spec") {
      bodyEl.appendChild(el("div", "spec-view", esc(JSON.stringify(spec, null, 2))));
    } else {
      // Data tab reads the rows bound into the spec (dataset.source is an
      // array of row objects); no separate copy is stored.
      const src = (spec && spec.dataset && Array.isArray(spec.dataset.source)) ? spec.dataset.source : [];
      const cols = (src.length && !Array.isArray(src[0])) ? Object.keys(src[0]) : [];
      const t = el("table");
      const tr = el("tr");
      cols.forEach(c => { const th = el("th"); th.textContent = c; tr.appendChild(th); });
      t.appendChild(tr);
      src.slice(0, 50).forEach(rowObj => {
        const r = el("tr");
        cols.forEach(c => r.appendChild(el("td", null, esc(rowObj[c]))));
        t.appendChild(r);
      });
      const wrap = el("div"); wrap.style.overflow = "auto"; wrap.appendChild(t);
      if (src.length > 50) wrap.appendChild(el("div", "card-meta", "Showing 50 of " + src.length + " rows"));
      bodyEl.appendChild(wrap);
    }
  }
  // Render once attached so the chart can measure its container.
  requestAnimationFrame(() => show("Chart"));
  return card;
}

/* ---------- thread rendering (from the model) ---------- */
function renderAgentMessage(msg) {
  const wrap = el("div", "agent");
  wrap.appendChild(el("div", "avatar"));
  const body = el("div", "agent-body");
  wrap.appendChild(body);

  if (msg.steps && msg.steps.length) {
    const trace = el("details", "trace");
    trace.appendChild(el("summary", null, msg.steps.length === 1 ? "1 step" : msg.steps.length + " steps"));
    const steps = el("div", "steps");
    msg.steps.forEach(s => {
      const d = el("div");
      d.appendChild(el("div", "step-label", esc(s.label)));
      if (s.detail) d.appendChild(el("div", "step-detail", esc(s.detail)));
      steps.appendChild(d);
    });
    trace.appendChild(steps);
    body.appendChild(trace);
  }
  (msg.paras || []).forEach(t => body.appendChild(el("div", "para", esc(t))));
  if (msg.chart) body.appendChild(buildChartCard(msg.chart));
  if (msg.error) {
    const c = el("div", "card");
    const b = el("div", "err");
    b.appendChild(el("div", "err-title", "Spec failed to render"));
    b.appendChild(el("div", "err-text", esc(msg.error)));
    c.appendChild(b);
    body.appendChild(c);
  }
  return wrap;
}

function renderThread() {
  disposeThreadCharts();
  threadInner.innerHTML = "";
  const chat = store.active();
  headerTitle.textContent = chat.title;

  if (!chat.messages.length) {
    const e = el("div", "empty");
    e.appendChild(el("h1", null, "¿Qué miramos del calzado?"));
    e.appendChild(el("p", null, "Pregunta por importaciones, exportaciones, socios comerciales, mix de producto o precios de calzado."));
    const chips = el("div", "chips");
    PROMPTS.forEach(p => {
      const b = el("button", null, esc(p));
      b.onclick = () => { draft.value = p; send(); };
      chips.appendChild(b);
    });
    e.appendChild(chips);
    threadInner.appendChild(e);
    return;
  }
  chat.messages.forEach(m => {
    if (m.role === "user") {
      const n = el("div", "user"); n.textContent = m.text;
      threadInner.appendChild(n);
    } else {
      threadInner.appendChild(renderAgentMessage(m));
    }
  });
  thread.scrollTop = thread.scrollHeight;
}

/* ---------- sidebar rendering ---------- */
let openMenuId = null;
let renamingId = null;

function renderSidebar() {
  sidebar.classList.toggle("collapsed", store.collapsed);
  const q = searchInput.value.trim().toLowerCase();
  chatList.innerHTML = "";
  chatList.appendChild(el("div", "sb-section", "Recent"));

  const rows = store.chats.filter(c => !q || c.title.toLowerCase().includes(q));
  if (!rows.length) {
    chatList.appendChild(el("div", "sb-section", q ? "No matches" : "No chats"));
  }
  rows.forEach(c => {
    const row = el("div", "chat-row" + (c.id === store.activeId ? " active" : ""));

    if (renamingId === c.id) {
      const input = el("input", "rename");
      input.value = c.title;
      const commit = () => {
        const v = input.value.trim();
        if (v) { c.title = v; c.updatedAt = Date.now(); store.save(); }
        renamingId = null;
        renderSidebar(); renderThread();
      };
      input.onkeydown = e => {
        if (e.key === "Enter") commit();
        else if (e.key === "Escape") { renamingId = null; renderSidebar(); }
      };
      input.onblur = commit;
      row.appendChild(input);
      chatList.appendChild(row);
      setTimeout(() => { input.focus(); input.select(); }, 0);
      return;
    }

    const sel = el("button", "sel"); sel.textContent = c.title;
    sel.onclick = () => {
      setView("chat");
      if (store.activeId === c.id) return;
      store.activeId = c.id; store.save();
      openMenuId = null;
      renderSidebar(); renderThread();
    };
    row.appendChild(sel);

    const menuBtn = el("button", "menu-btn" + (openMenuId === c.id ? " open" : ""),
      '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="4" cy="8" r="1.35"></circle><circle cx="8" cy="8" r="1.35"></circle><circle cx="12" cy="8" r="1.35"></circle></svg>');
    menuBtn.onclick = e => {
      e.stopPropagation();
      openMenuId = openMenuId === c.id ? null : c.id;
      renderSidebar();
    };
    row.appendChild(menuBtn);

    if (openMenuId === c.id) {
      const pop = el("div", "menu-pop");
      const rename = el("button", null, "Rename");
      rename.onclick = e => { e.stopPropagation(); openMenuId = null; renamingId = c.id; renderSidebar(); };
      const del = el("button", "danger", "Delete chat");
      del.onclick = e => { e.stopPropagation(); openMenuId = null; renderSidebar(); askDelete(c); };
      pop.appendChild(rename); pop.appendChild(del);
      row.appendChild(pop);
    }
    chatList.appendChild(row);
  });
}

document.addEventListener("click", e => {
  if (openMenuId && !e.target.closest(".chat-row")) { openMenuId = null; renderSidebar(); }
});

/* ---------- delete confirm + undo toast ---------- */
let toastTimer = null;

function askDelete(chat) {
  const overlay = el("div", "overlay");
  const dialog = el("div", "dialog");
  dialog.appendChild(el("h3", null, "Delete chat?"));
  dialog.appendChild(el("p", null, esc("“" + chat.title + "” and its charts will be removed. This can’t be undone.")));
  const row = el("div", "row");
  const cancel = el("button", "cancel", "Cancel");
  cancel.onclick = () => overlay.remove();
  const confirm = el("button", "confirm", "Delete");
  confirm.onclick = () => {
    overlay.remove();
    const trash = store.remove(chat.id);
    renderSidebar(); renderThread();
    if (trash) showUndo(trash);
  };
  row.appendChild(cancel); row.appendChild(confirm);
  dialog.appendChild(row);
  overlay.appendChild(dialog);
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function toast(text) {
  clearTimeout(toastTimer);
  $(".toast")?.remove();
  const t = el("div", "toast");
  t.appendChild(el("span", null, esc(text)));
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 4000);
}

function showUndo(trash) {
  clearTimeout(toastTimer);
  $(".toast")?.remove();
  const t = el("div", "toast");
  t.appendChild(el("span", null, "Chat deleted"));
  const undo = el("button", null, "Undo");
  undo.onclick = () => {
    clearTimeout(toastTimer);
    t.remove();
    store.chats.splice(Math.min(trash.idx, store.chats.length), 0, trash.chat);
    store.activeId = trash.chat.id;
    store.save();
    renderSidebar(); renderThread();
  };
  t.appendChild(undo);
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 5000);
}

/* ---------- streaming a turn ---------- */
let busy = false;

function liveAgentBlock() {
  const wrap = el("div", "agent");
  wrap.appendChild(el("div", "avatar"));
  const body = el("div", "agent-body");
  wrap.appendChild(body);
  threadInner.appendChild(wrap);

  const trace = el("details", "trace");
  trace.appendChild(el("summary", null, "steps"));
  const stepsEl = el("div", "steps");
  trace.appendChild(stepsEl);
  let hasSteps = false;

  const thinking = el("div", "thinking", "<i></i><i></i><i></i><span></span>");
  body.appendChild(thinking);
  let paraEl = null;  // the paragraph currently being streamed into

  return {
    thinking(label) { thinking.querySelector("span").textContent = label; },
    step(label, detail) {
      if (!hasSteps) { body.insertBefore(trace, thinking); hasSteps = true; }
      const s = el("div");
      s.appendChild(el("div", "step-label", esc(label)));
      if (detail) s.appendChild(el("div", "step-detail", esc(detail)));
      stepsEl.appendChild(s);
      trace.querySelector("summary").textContent =
        stepsEl.children.length === 1 ? "1 step" : stepsEl.children.length + " steps";
    },
    delta(t) {
      thinking.remove();
      if (!paraEl) { paraEl = el("div", "para"); body.appendChild(paraEl); }
      paraEl.textContent += t;
    },
    text(t) {
      thinking.remove();
      if (paraEl) { paraEl.textContent = t; paraEl = null; }
      else body.appendChild(el("div", "para", esc(t)));
    },
    error(msg) {
      thinking.remove();
      const c = el("div", "card");
      const b = el("div", "err");
      b.appendChild(el("div", "err-title", "Spec failed to render"));
      b.appendChild(el("div", "err-text", esc(msg)));
      c.appendChild(b);
      body.appendChild(c);
    },
    chart(payload) { thinking.remove(); body.appendChild(buildChartCard(payload)); },
    done() { thinking.remove(); },
  };
}

async function send() {
  const text = draft.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; draft.value = "";

  const chat = store.active();

  // Prior turns for context: user questions + the agent's prose answers.
  const history = [];
  for (const m of chat.messages) {
    if (m.role === "user") history.push({ role: "user", content: m.text });
    else if (m.role === "agent" && m.paras && m.paras.length)
      history.push({ role: "assistant", content: m.paras.join("\n\n") });
  }
  const trimmedHistory = history.slice(-MAX_HISTORY_TURNS);

  chat.messages.push({ role: "user", text });
  if (chat.title === "Nuevo chat") chat.title = text.length > 38 ? text.slice(0, 38) + "…" : text;
  const aMsg = { role: "agent", steps: [], paras: [], chart: null, error: null, time: null };
  chat.messages.push(aMsg);
  chat.updatedAt = Date.now();
  store.save();

  $(".empty")?.remove();
  const userNode = el("div", "user"); userNode.textContent = text;
  threadInner.appendChild(userNode);
  headerTitle.textContent = chat.title;
  renderSidebar();

  const agent = liveAgentBlock();
  agent.thinking("Working…");
  thread.scrollTop = thread.scrollHeight;

  let res;
  try {
    res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ session_id: chat.id, message: text, history: trimmedHistory }),
    });
  } catch (e) {
    agent.error("Network error: " + e);
    aMsg.error = "Network error: " + e; store.save();
    busy = false; sendBtn.disabled = false; return;
  }
  if (!res.ok) {
    agent.error("Server error " + res.status);
    aMsg.error = "Server error " + res.status; store.save();
    busy = false; sendBtn.disabled = false; return;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const chunks = buf.split("\n\n");
    buf = chunks.pop();
    for (const chunk of chunks) {
      const lines = chunk.split("\n");
      const ev = (lines.find(l => l.startsWith("event: ")) || "").slice(7).trim();
      const dataLine = lines.find(l => l.startsWith("data: "));
      if (!ev || !dataLine) continue;
      const d = JSON.parse(dataLine.slice(6));
      if (ev === "thinking") agent.thinking(d.label);
      else if (ev === "step") { agent.step(d.label, d.detail); aMsg.steps.push({ label: d.label, detail: d.detail }); }
      else if (ev === "delta") agent.delta(d.text);
      else if (ev === "text") { agent.text(d.text); aMsg.paras = [d.text]; }
      else if (ev === "chart") { agent.chart(d); aMsg.chart = { title: d.title, meta: d.meta, spec: d.spec }; }
      else if (ev === "error") { agent.error(d.message); aMsg.error = d.message; }
      else if (ev === "done") { agent.done(); aMsg.time = d.seconds; }
      thread.scrollTop = thread.scrollHeight;
    }
  }
  chat.updatedAt = Date.now();
  store.save();
  if (store.evicted) {
    toast("Older chats dropped to free storage space");
    store.evicted = 0;
    renderSidebar();
  }
  busy = false; sendBtn.disabled = false;
}

/* ---------- reports view ---------- */
const REPORT_WIDGETS = [
  { key: "evolution", half: false,
    url: f => `/api/v1/reports/footwear/evolution?flow=${f.flow}&taric=${f.taric}&months=${f.months}` },
  { key: "countries", half: false,
    url: f => `/api/v1/reports/footwear/countries?flow=${f.flow}&taric=${f.taric}&top_n=10` },
  { key: "mix", half: true,
    url: f => `/api/v1/reports/footwear/product-mix?flow=${f.flow}` },
  { key: "price", half: true,
    url: f => `/api/v1/reports/footwear/avg-price?flow=${f.flow}&taric=${f.taric}&months=${f.months}` },
  { key: "balance", half: false,
    url: f => `/api/v1/reports/footwear/balance?taric=${f.taric}&months=${f.months}` },
];
const rpCharts = {};
let rpInited = false;

const rpFilters = () => ({
  flow: $("#rpFlow").value, taric: $("#rpTaric").value, months: $("#rpMonths").value,
});

async function loadReports() {
  const grid = $("#rpGrid");
  Object.values(rpCharts).forEach(c => c.dispose());
  for (const k in rpCharts) delete rpCharts[k];
  grid.innerHTML = "";
  const f = rpFilters();

  for (const w of REPORT_WIDGETS) {
    const card = el("div", "rp-card" + (w.half ? " half" : ""));
    grid.appendChild(card);
    try {
      const spec = await fetch(w.url(f)).then(r => r.json());
      const head = el("div", "rp-card-head");
      head.appendChild(el("div", "rp-card-title", spec.title || w.key));
      const kpis = el("div", "rp-kpis");
      (spec.kpis || []).forEach(k =>
        kpis.appendChild(el("span", "rp-kpi " + (k.tone || ""), `${k.label}: ${k.value}`)));
      if (kpis.children.length) head.appendChild(kpis);
      card.appendChild(head);

      const host = el("div", "rp-chart");
      card.appendChild(host);
      const m = spec.meta || {};
      card.appendChild(el("div", "rp-meta",
        [m.unit && "unidad " + m.unit, m.granularity, m.is_provisional && "· datos provisionales"]
          .filter(Boolean).join(" ")));

      const inst = echarts.init(host, chartTheme === "default" ? null : chartTheme, { renderer: "svg" });
      inst.setOption(Object.assign({ backgroundColor: "transparent" }, spec.echarts));
      new ResizeObserver(() => inst.resize()).observe(host);
      rpCharts[w.key] = inst;
    } catch (e) {
      card.appendChild(el("div", "rp-err", `No se pudo cargar «${w.key}»: ${e}`));
    }
  }
}

async function initReports() {
  try {
    const opts = await fetch("/api/v1/reports/footwear/filters/options").then(r => r.json());
    const sel = $("#rpTaric");
    (opts.headings || []).forEach(h => {
      const o = el("option", null, `${h.code} — ${h.description}`);
      o.value = h.code;
      sel.appendChild(o);
    });
  } catch (e) { /* selectores mínimos si falla */ }
  ["#rpFlow", "#rpTaric", "#rpMonths"].forEach(s => $(s).addEventListener("change", loadReports));
}

function setView(v) {
  const reports = v === "reports";
  $("#chatView").hidden = reports;
  $("#reportsView").hidden = !reports;
  $("#navReports").classList.toggle("active", reports);
  $("#themeSel").hidden = reports;
  $("#headerTitle").textContent = reports ? "Panel de reportes" : store.active().title;
  if (reports) {
    if (!rpInited) { rpInited = true; initReports().then(loadReports); }
    else loadReports();
  }
}

$("#navReports").onclick = () => setView("reports");
$("#rpBack").onclick = () => setView("chat");
$("#hintReports").onclick = e => { e.preventDefault(); setView("reports"); };

/* ---------- wiring ---------- */
$("#newChatBtn").onclick = () => {
  setView("chat");
  const chat = store.active();
  if (chat.messages.length === 0) { draft.focus(); return; }
  store.newChat();
  searchInput.value = "";
  renderSidebar(); renderThread();
  draft.focus();
};
$("#collapseBtn").onclick = () => {
  store.collapsed = !store.collapsed; store.save();
  renderSidebar();
};
searchInput.addEventListener("input", renderSidebar);
sendBtn.onclick = send;
draft.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

const themeSel = $("#themeSel");
THEMES.forEach(([value, label]) => {
  const o = document.createElement("option");
  o.value = value; o.textContent = label;
  themeSel.appendChild(o);
});
themeSel.addEventListener("change", () => {
  store.theme = themeSel.value;
  chartTheme = store.theme;
  store.save();
  renderThread();
});

store.load();
chartTheme = store.theme;
themeSel.value = store.theme;
renderSidebar();
renderThread();
</script>
